# Merge this mapping into %LOCALAPPDATA%\hermes\config.yaml on native Windows.
# Replace {REPOSITORY_PATH}; do not add credentials here.
mcp_servers:
  opportunityos:
    command: "{REPOSITORY_PATH}\\.venv\\Scripts\\opportunityos-mcp.exe"
    args: []
    env:
      OPPORTUNITYOS_REPOSITORY_ROOT: "{REPOSITORY_PATH}"
    enabled: true
    tools:
      include:
        - profile_get_current
        - profile_get_fact
        - profile_submit_observations
        - profile_get_dependencies
        - profile_rebuild_projection
        - profile_sync_status
        - profile_sync_github
        - review_list
        - review_get
        - review_resolve
        - review_defer
        - opportunity_submit_input
        - opportunity_submit_source
        - opportunity_submit_extraction
        - opportunity_get
        - opportunity_find_duplicates
        - opportunity_reverify
        - eligibility_evaluate
        - assessment_submit
        - evaluation_compute
        - evaluation_get
        - queue_list
        - queue_next
        - action_create
        - action_complete
        - action_skip
        - application_create
        - application_prepare_context
        - application_prepare
        - application_store_artifact
        - application_mark_ready
        - lifecycle_update
        - scout_begin
        - scout_record_candidate
        - scout_record_usage
        - scout_finish
        - system_status
        - backup_create
