name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv lock --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=opportunityos --cov-report=xml --cov-fail-under=80
      - run: uv run coverage report --include="*/opportunityos/domain/*" --fail-under=90
      - run: uv run python scripts/audit_public_repo.py
      - run: uv build

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run pytest tests/integration/test_private_runtime.py tests/integration/test_migrations.py tests/e2e/test_cli.py
      - run: uv run opportunityos setup
      - run: uv run opportunityos doctor
