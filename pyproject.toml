[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opportunityos"
version = "4.0.0"
description = "Model-agnostic, self-learning opportunity discovery memory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chimdumebi Nebolisa" }]
dependencies = [
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
opportunityos = "opportunityos.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunityos"]

[tool.hatch.build]
include = ["src/opportunityos"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["live: requires external credentials or network"]

[tool.coverage.run]
source = ["opportunityos"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
